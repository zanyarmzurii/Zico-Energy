<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ZICO v6 Admin</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-950 text-white min-h-screen font-sans"><main class="max-w-6xl mx-auto p-5 md:p-10"><div class="flex flex-wrap items-center justify-between gap-4"><div><p class="text-orange-400 text-xs font-black tracking-widest">ZICO ENERGY</p><h1 class="text-3xl font-black">v6 Admin Dashboard</h1><p class="text-slate-500 text-sm mt-1">Private dashboard — requires ZICO_ADMIN_KEY.</p></div><button onclick="load()" class="px-4 py-2 rounded-xl bg-orange-500 font-bold">Refresh</button></div><div id="login" class="mt-8 max-w-md rounded-3xl border border-slate-800 bg-slate-900 p-5"><input id="key" type="password" placeholder="Admin key" class="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 outline-none"><button onclick="load()" class="mt-3 w-full p-3 rounded-xl bg-blue-600 font-bold">Open dashboard</button></div><div id="app" class="hidden mt-8 space-y-6"><div id="cards" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4"></div><section class="rounded-3xl border border-slate-800 bg-slate-900 p-5"><h2 class="font-black mb-4">Recent orders</h2><div id="orders" class="overflow-auto"></div></section><section class="rounded-3xl border border-slate-800 bg-slate-900 p-5"><h2 class="font-black mb-4">Distributor applications</h2><div id="dists" class="overflow-auto"></div></section><section class="rounded-3xl border border-slate-800 bg-slate-900 p-5"><h2 class="font-black mb-4">Reviews</h2><div id="reviews" class="overflow-auto"></div></section></div></main><script>let key='';const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function reviewStatus(id,status){const r=await fetch('/api/admin?type=review-status',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':key},body:JSON.stringify({id,status})});if(!r.ok){alert('Action failed');return}load()}async function load(){key=document.getElementById('key').value||key;if(!key)return;const r=await fetch('/api/admin?type=summary',{headers:{'x-admin-key':key}});if(!r.ok){alert('Unauthorized or API not configured');return}const d=await r.json();document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('cards').innerHTML=[['Orders',d.orders.length],['Demand',d.demand.length],['Distributors',d.distributors.length],['Reviews',d.reviews.length]].map(x=>`<div class="rounded-2xl bg-slate-900 border border-slate-800 p-5"><p class="text-slate-500 text-xs">${x[0]}</p><b class="text-3xl">${x[1]}</b></div>`).join('');document.getElementById('orders').innerHTML=d.orders.slice(0,20).map(o=>`<div class="border-b border-slate-800 py-3 text-sm"><b>${esc(o.id)}</b> · ${esc(o.region)} · ${esc(o.currency)} · ${esc(o.total)}<div class="text-slate-500 text-xs">${esc(o.customer?.name)} · ${esc(o.customer?.phone)} · ${esc(o.customer?.city)}</div></div>`).join('')||'<p class="text-slate-500">No orders</p>';document.getElementById('dists').innerHTML=d.distributors.map(x=>`<div class="border-b border-slate-800 py-3 text-sm"><b>${esc(x.name)}</b> · ${esc(x.city)} · ${esc(x.phone)} · <span class="text-orange-400">${esc(x.status)}</span><div class="text-slate-500 text-xs">${esc(x.business)} · ${esc(x.capacity)}</div></div>`).join('')||'<p class="text-slate-500">No applications</p>';document.getElementById('reviews').innerHTML=d.reviews.map(x=>`<div class="border-b border-slate-800 py-3 text-sm"><b>${esc(x.stars)}/5</b> · ${esc(x.flavor)} · <span class="text-orange-400">${esc(x.status)}</span><p class="text-slate-400">${esc(x.text)}</p><div class="mt-2 flex gap-2"><button onclick="reviewStatus('${esc(x.id)}','approved')" class="px-3 py-1 rounded-lg bg-green-700 text-xs font-bold">Approve</button><button onclick="reviewStatus('${esc(x.id)}','rejected')" class="px-3 py-1 rounded-lg bg-red-700 text-xs font-bold">Reject</button></div></div>`).join('')||'<p class="text-slate-500">No reviews</p>'}</script></body></html>
