<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Ziman — AI & Language Ecosystem</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family:
        "Noto Sans Kurdish",
        "Noto Sans Arabic",
        Arial,
        sans-serif;
      background: #000;
    }

    body {
      color: #fff;
    }

    /* =========================
       SLIDER
    ========================== */

    .slider {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    .slides {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 0.9s ease,
        visibility 0.9s ease;

      background: #000;
      z-index: 0;
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
      z-index: 2;
    }

    /* =========================
       IMAGE
    ========================== */

    .slide-image {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      display: block;

      transform: scale(1.02);

      transition:
        transform 7s ease,
        opacity 0.8s ease;
    }

    .slide.active .slide-image {
      transform: scale(1);
    }

    /* =========================
       DARK OVERLAY
    ========================== */

    .slide::after {
      content: "";
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.18) 0%,
          rgba(0, 0, 0, 0.05) 35%,
          rgba(0, 0, 0, 0.35) 100%
        );

      pointer-events: none;
    }

    /* =========================
       TEXT
    ========================== */

    .slide-content {
      position: absolute;
      z-index: 5;

      left: 50%;
      bottom: 10%;

      transform: translateX(-50%);

      width: min(90%, 900px);

      text-align: center;

      pointer-events: none;
    }

    .slide-title,
    .slide-description {
      display: none;
    }

    /*
      Intentionally no visible text.
      All slide content remains image-based.
    */

    /* =========================
       SPONSOR SLIDE
    ========================== */

    .sponsor-slide {
      cursor: pointer;
    }

    .sponsor-slide .slide-image {
      cursor: pointer;
    }

    /* =========================
       NAVIGATION ARROWS
    ========================== */

    .arrow {
      position: absolute;
      z-index: 20;

      top: 50%;
      transform: translateY(-50%);

      width: 48px;
      height: 48px;

      border: 1px solid rgba(255, 255, 255, 0.25);

      border-radius: 50%;

      background: rgba(0, 0, 0, 0.28);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      color: #fff;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 26px;

      cursor: pointer;

      opacity: 0;

      transition:
        opacity 0.3s ease,
        background 0.3s ease,
        transform 0.3s ease;
    }

    .slider:hover .arrow {
      opacity: 1;
    }

    .arrow:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .arrow:active {
      transform: translateY(-50%) scale(0.92);
    }

    .arrow.prev {
      left: 25px;
    }

    .arrow.next {
      right: 25px;
    }

    /* =========================
       DOTS
    ========================== */

    .dots {
      position: absolute;

      z-index: 30;

      bottom: 24px;
      left: 50%;

      transform: translateX(-50%);

      display: flex;
      align-items: center;
      gap: 7px;

      padding: 8px 12px;

      border-radius: 50px;

      background: rgba(0, 0, 0, 0.25);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: rgba(255, 255, 255, 0.4);

      cursor: pointer;

      transition:
        width 0.3s ease,
        background 0.3s ease;
    }

    .dot.active {
      width: 24px;
      border-radius: 20px;
      background: #fff;
    }

    /* =========================
       PROGRESS BAR
    ========================== */

    .progress {
      position: absolute;

      z-index: 40;

      top: 0;
      left: 0;

      width: 100%;
      height: 2px;

      background: rgba(255, 255, 255, 0.12);
    }

    .progress-bar {
      width: 0%;
      height: 100%;

      background: rgba(255, 255, 255, 0.9);

      transition: width linear;
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 768px) {
      .arrow {
        width: 40px;
        height: 40px;

        font-size: 21px;

        opacity: 0.7;
      }

      .arrow.prev {
        left: 12px;
      }

      .arrow.next {
        right: 12px;
      }

      .dots {
        bottom: 16px;
      }

      .dot {
        width: 6px;
        height: 6px;
      }

      .dot.active {
        width: 20px;
      }
    }

    /* =========================
       ACCESSIBILITY
    ========================== */

    @media (prefers-reduced-motion: reduce) {
      .slide,
      .slide-image,
      .arrow,
      .dot,
      .progress-bar {
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main class="slider" id="slider">

      <section

      <!-- 08 -->

      <!-- 09 -->

      <!-- 10 -->
      <section

      >
        <img
          class="slide-image"
          src="assets/images/slide9.jpg"

        />
      </section>


      <!-- 11 -->
      <section

      >
        <img
          class="slide-image"

    </div>


    <!-- =========================
         PREVIOUS / NEXT
    ========================== -->

    <button
      class="arrow prev"
      id="prevBtn"
      aria-label="Previous Slide"
      type="button"
    >
      ❮
    </button>

    <button
      class="arrow next"
      id="nextBtn"
      aria-label="Next Slide"
      type="button"
    >
      ❯
    </button>


    <!-- =========================
         DOT NAVIGATION
    ========================== -->

    <div
      class="dots"
      id="dots"
      aria-label="Slide Navigation"
    ></div>

  </main>


  <script>

    /* ==========================================
       ZIMAN SLIDE SHOW
       ========================================== */

    (() => {

      "use strict";


      /* ==========================================
         CONFIGURATION
      ========================================== */

      const SLIDE_DURATION = 6000;

      const AUTO_PLAY = true;

      const LOOP = true;


      /* ==========================================
         ELEMENTS
      ========================================== */

      const slider = document.getElementById("slider");

      const slides = Array.from(
        document.querySelectorAll(".slide")
      );

      const prevBtn = document.getElementById("prevBtn");

      const nextBtn = document.getElementById("nextBtn");

      const dotsContainer = document.getElementById("dots");

      const progressBar =
        document.getElementById("progressBar");

      const sponsorSlide =
        document.getElementById("sponsorSlide");


      /* ==========================================
         STATE
      ========================================== */

      let currentSlide = 0;

      let timer = null;

      let progressTimer = null;

      let touchStartX = 0;

      let touchEndX = 0;


      /* ==========================================
         CREATE DOTS
      ========================================== */

      slides.forEach((slide, index) => {

        const dot = document.createElement("button");

        dot.type = "button";

        dot.className = "dot";

        dot.setAttribute(
          "aria-label",
          `Go to slide ${index + 1}`
        );

        dot.addEventListener("click", () => {

          goToSlide(index);

        });

        dotsContainer.appendChild(dot);

      });


      const dots = Array.from(
        document.querySelectorAll(".dot")
      );


      /* ==========================================
         SHOW SLIDE
      ========================================== */

      function showSlide(index) {

        if (!slides.length) return;


        slides.forEach((slide, i) => {

          slide.classList.toggle(
            "active",
            i === index
          );

        });


        dots.forEach((dot, i) => {

          dot.classList.toggle(
            "active",
            i === index
          );

        });


        currentSlide = index;


        resetProgress();

      }


      /* ==========================================
         NEXT
      ========================================== */

      function nextSlide() {

        let nextIndex = currentSlide + 1;


        if (nextIndex >= slides.length) {

          if (LOOP) {

            nextIndex = 0;

          } else {

            nextIndex = slides.length - 1;

          }

        }


        showSlide(nextIndex);

      }


      /* ==========================================
         PREVIOUS
      ========================================== */

      function previousSlide() {

        let previousIndex = currentSlide - 1;


        if (previousIndex < 0) {

          if (LOOP) {

            previousIndex =
              slides.length - 1;

          } else {

            previousIndex = 0;

          }

        }


        showSlide(previousIndex);

      }


      /* ==========================================
         GO TO SPECIFIC SLIDE
      ========================================== */

      function goToSlide(index) {

        if (
          index < 0 ||
          index >= slides.length
        ) {
          return;
        }


        showSlide(index);

        restartAutoPlay();

      }


      /* ==========================================
         AUTO PLAY
      ========================================== */

      function startAutoPlay() {

        if (!AUTO_PLAY) return;


        clearInterval(timer);


        timer = setInterval(() => {

          nextSlide();

        }, SLIDE_DURATION);

      }


      function stopAutoPlay() {

        clearInterval(timer);

        timer = null;

      }


      function restartAutoPlay() {

        stopAutoPlay();

        startAutoPlay();

      }


      /* ==========================================
         PROGRESS BAR
      ========================================== */

      function resetProgress() {

        progressBar.style.transition = "none";

        progressBar.style.width = "0%";


        requestAnimationFrame(() => {

          requestAnimationFrame(() => {

            progressBar.style.transition =
              `width ${SLIDE_DURATION}ms linear`;

            progressBar.style.width = "100%";

          });

        });

      }


      /* ==========================================
         BUTTONS
      ========================================== */

      nextBtn.addEventListener(
        "click",
        () => {

          nextSlide();

          restartAutoPlay();

        }
      );


      prevBtn.addEventListener(
        "click",
        () => {

          previousSlide();

          restartAutoPlay();

        }
      );


      /* ==========================================
         KEYBOARD
      ========================================== */

      document.addEventListener(
        "keydown",
        (event) => {

          if (event.key === "ArrowRight") {

            nextSlide();

            restartAutoPlay();

          }


          if (event.key === "ArrowLeft") {

            previousSlide();

            restartAutoPlay();

          }

        }
      );


      /* ==========================================
         MOUSE HOVER
      ========================================== */

      slider.addEventListener(
        "mouseenter",
        () => {

          stopAutoPlay();

        }
      );


      slider.addEventListener(
        "mouseleave",
        () => {

          startAutoPlay();

        }
      );


      /* ==========================================
         TOUCH / SWIPE
      ========================================== */

      slider.addEventListener(
        "touchstart",
        (event) => {

          touchStartX =
            event.changedTouches[0].screenX;

          stopAutoPlay();

        },
        { passive: true }
      );


      slider.addEventListener(
        "touchend",
        (event) => {

          touchEndX =
            event.changedTouches[0].screenX;


          handleSwipe();

          startAutoPlay();

        },
        { passive: true }
      );


      function handleSwipe() {

        const distance =
          touchEndX - touchStartX;


        const minimumSwipeDistance = 50;


        if (
          Math.abs(distance) <
          minimumSwipeDistance
        ) {

          return;

        }


        /*
          RTL-friendly navigation:
          Swipe left  → next
          Swipe right → previous
        */

        if (distance < 0) {

          nextSlide();

        } else {

          previousSlide();

        }

      }


      /* ==========================================
         SPONSOR / ADVERTISEMENT SLIDE
         
         slide6.jpg is the dedicated
         sponsor / advertising slide.

         Change this URL to your actual
         sponsor page when available.
      ========================================== */

      sponsorSlide.addEventListener(
        "click",
        () => {

          /*
            IMPORTANT:
            Put your sponsor page here.

            Example:

            window.location.href =
              "/sponsor.html";

          */

          window.location.href =
            "/sponsor.html";

        }
      );


      /* ==========================================
         PRELOAD ALL IMAGES
      ========================================== */

      const imagePaths = [

        "assets/images/slide1.jpg",
        "assets/images/slide2.jpg",
        "assets/images/slide3.jpg",
        "assets/images/slide4.jpg",
        "assets/images/slide5.jpg",
        "assets/images/slide6.jpg",
        "assets/images/slide7.jpg",
        "assets/images/slide8.jpg",
        "assets/images/slide9.jpg",
        "assets/images/slide10.jpg",
        "assets/images/slide11.jpg"

      ];


      imagePaths.forEach((src) => {

        const image =
          new Image();

        image.src = src;

      });


      /* ==========================================
         VISIBILITY
      ========================================== */

      document.addEventListener(
        "visibilitychange",
        () => {

          if (
            document.hidden
          ) {

            stopAutoPlay();

          } else {

            startAutoPlay();

          }

        }
      );


      /* ==========================================
         INITIALIZE
      ========================================== */

      showSlide(0);

      startAutoPlay();


    })();

  </script>

</body>
